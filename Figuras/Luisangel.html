<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Cabaña Nocturna en el Bosque</title>
    <!-- Tailwind CSS para el diseño de la interfaz de usuario -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #0b0f19;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Custom scrollbar for modern look */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="relative text-slate-100">

    <!-- Canvas principal para Three.js -->
    <div id="canvas-container"></div>

    <!-- Panel de Control UI -->
    <div class="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700/50 shadow-2xl max-w-xs w-full transition-all duration-300">
        <div class="flex items-center justify-between mb-4">
            <h1 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Cabaña en el Bosque
            </h1>
            <span class="text-xs bg-slate-800 text-slate-400 px-2 py-1 rounded-full border border-slate-700">3D Scene</span>
        </div>

        <p class="text-xs text-slate-300 mb-4 leading-relaxed">
            Explora la escena 3D estilo vector/flat. Mantén presionado el clic izquierdo para rotar y la rueda para hacer zoom.
        </p>

        <!-- Controles Interactivos -->
        <div class="space-y-3">
            <button id="btn-lights" class="w-full py-2.5 px-4 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl font-medium text-sm transition flex items-center justify-between">
                <span>Luces de la Cabaña</span>
                <span id="status-lights" class="text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded-md font-bold">ON</span>
            </button>

            <button id="btn-mode" class="w-full py-2.5 px-4 bg-indigo-500/20 hover:bg-indigo-500/30 text-indigo-300 border border-indigo-500/40 rounded-xl font-medium text-sm transition flex items-center justify-between">
                <span>Modo Ambiente</span>
                <span id="status-mode" class="text-xs bg-indigo-400 text-slate-900 px-2 py-0.5 rounded-md font-bold">Noche</span>
            </button>

            <button id="btn-reset" class="w-full py-2 px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-xl text-xs font-medium transition flex items-center justify-center gap-2 mt-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
                Restablecer Vista
            </button>
        </div>
    </div>

    <!-- Instrucciones de navegación rápidas abajo a la derecha -->
    <div class="absolute bottom-4 right-4 z-10 bg-slate-900/60 backdrop-blur-sm px-4 py-2 rounded-xl border border-slate-800 text-xs text-slate-400 hidden sm:block">
        Rotar: Clic Izquierdo | Mover: Clic Derecho | Zoom: Rueda
    </div>

    <!-- Importación de librerías Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- CONFIGURACIÓN DE LA ESCENA ---
        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0c121e);
        scene.fog = new THREE.FogExp2(0x0c121e, 0.008);

        // Cámara
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const initialCameraPos = new THREE.Vector3(0, 12, 45);
        camera.position.copy(initialCameraPos);

        // Renderizador
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // Orbit Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.02; // No pasar por debajo del suelo
        controls.minDistance = 10;
        controls.maxDistance = 90;
        controls.target.set(0, 4, 0);

        // --- PALETA DE COLORES (Adaptada fielmente a la imagen) ---
        const PALETTE = {
            nightSky: 0x0c121e,
            daySky: 0x87ceeb,
            moon: 0xe6eef4,
            moonGlow: 0xd0e2ec,
            mountainBack: 0x3d2b3d,
            mountainFront: 0x271f2d,
            pineDark: 0x112b2a,
            pineMed: 0x1a433f,
            pineLight: 0x275953,
            deciduousTree: 0x4a7c6d,
            cabinWoodDark: 0x281e22,
            cabinWoodLight: 0x433238,
            cabinRoof: 0x2c333a,
            windowGlow: 0xebf39a,
            groundDark: 0x1a1219,
            groundPath: 0x312e3b,
            water: 0x284255,
            bush: 0x21473f,
            cloud: 0x3a4854
        };

        // --- ILUMINACIÓN ---
        const ambientLight = new THREE.AmbientLight(0x233142, 0.8);
        scene.add(ambientLight);

        // Luz de la Luna (Directional)
        const moonLight = new THREE.DirectionalLight(0xb0c4de, 1.2);
        moonLight.position.set(-15, 35, -20);
        moonLight.castShadow = true;
        moonLight.shadow.mapSize.width = 2048;
        moonLight.shadow.mapSize.height = 2048;
        moonLight.shadow.camera.near = 0.5;
        moonLight.shadow.camera.far = 150;
        const d = 30;
        moonLight.shadow.camera.left = -d;
        moonLight.shadow.camera.right = d;
        moonLight.shadow.camera.top = d;
        moonLight.shadow.camera.bottom = -d;
        moonLight.shadow.bias = -0.0005;
        scene.add(moonLight);

        // Luces Cálidas del Interior de la Cabaña
        const windowLights = [];
        const cabinLight1 = new THREE.PointLight(0xffea9f, 2.5, 12);
        cabinLight1.position.set(2, 4, 1);
        cabinLight1.castShadow = true;
        scene.add(cabinLight1);
        windowLights.push(cabinLight1);

        const cabinLight2 = new THREE.PointLight(0xffcc66, 1.8, 10);
        cabinLight2.position.set(-3, 3, 0);
        scene.add(cabinLight2);
        windowLights.push(cabinLight2);

        // --- MATERIALES REUTILIZABLES (Toque Low-Poly Matte) ---
        const flatMat = (color, options = {}) => new THREE.MeshStandardMaterial({
            color: color,
            roughness: options.roughness !== undefined ? options.roughness : 0.9,
            metalness: options.metalness !== undefined ? options.metalness : 0.1,
            flatShading: true,
            ...options
        });

        // --- CONSTRUCCIÓN DE LA ESCENA ---

        // 1. TERRENO & LAGO
        const groundGroup = new THREE.Group();

        // Base de Tierra
        const groundGeo = new THREE.CylinderGeometry(35, 38, 2, 32);
        const groundMat = flatMat(PALETTE.groundDark);
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.position.y = -1;
        ground.receiveShadow = true;
        groundGroup.add(ground);

        // Superficie irregular (Lomas de hierba oscura)
        const bumpGeo = new THREE.IcosahedronGeometry(8, 2);
        const bump1 = new THREE.Mesh(bumpGeo, flatMat(PALETTE.groundDark));
        bump1.position.set(-15, -4, 5);
        bump1.scale.set(2, 0.6, 1.5);
        groundGroup.add(bump1);

        const bump2 = new THREE.Mesh(bumpGeo, flatMat(PALETTE.groundDark));
        bump2.position.set(12, -4, -8);
        bump2.scale.set(1.8, 0.5, 1.8);
        groundGroup.add(bump2);

        // Estanque / Lago con espejo de agua
        const waterGeo = new THREE.PlaneGeometry(28, 16, 16, 16);
        // Deformar un poco el plano para forma orgánica de lago
        const posAttr = waterGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const y = posAttr.getY(i);
            const wave = Math.sin(x * 0.3) * Math.cos(y * 0.3) * 0.5;
            posAttr.setZ(i, wave);
        }
        waterGeo.computeVertexNormals();

        const waterMat = new THREE.MeshStandardMaterial({
            color: PALETTE.water,
            roughness: 0.1,
            metalness: 0.8,
            transparent: true,
            opacity: 0.85,
            flatShading: true
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.set(6, 0.05, 12);
        water.receiveShadow = true;
        groundGroup.add(water);

        // Caminito hacia la puerta
        const pathGeo = new THREE.PlaneGeometry(3.5, 10);
        const pathMat = flatMat(PALETTE.groundPath);
        const path = new THREE.Mesh(pathGeo, pathMat);
        path.rotation.x = -Math.PI / 2;
        path.rotation.z = -0.2;
        path.position.set(-0.5, 0.02, 7);
        path.receiveShadow = true;
        groundGroup.add(path);

        scene.add(groundGroup);

        // 2. FONDO: LUNA, MONTAÑAS Y NUBES
        const backdropGroup = new THREE.Group();

        // Luna Llena Grande
        const moonGeo = new THREE.SphereGeometry(10, 32, 32);
        const moonMat = new THREE.MeshBasicMaterial({
            color: PALETTE.moon,
        });
        const moon = new THREE.Mesh(moonGeo, moonMat);
        moon.position.set(-12, 28, -45);
        backdropGroup.add(moon);

        // Resplandor de la Luna (Aro tras translúcido)
        const moonGlowGeo = new THREE.CircleGeometry(13, 32);
        const moonGlowMat = new THREE.MeshBasicMaterial({
            color: PALETTE.moonGlow,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide
        });
        const moonGlow = new THREE.Mesh(moonGlowGeo, moonGlowMat);
        moonGlow.position.set(-12, 28, -45.5);
        backdropGroup.add(moonGlow);

        // Montañas del Fondo (Siluetas)
        function createMountain(x, z, scaleX, scaleY, color) {
            const geo = new THREE.ConeGeometry(15, 30, 5);
            const mat = flatMat(color);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, scaleY / 2 - 5, z);
            mesh.scale.set(scaleX, scaleY / 30, scaleX);
            mesh.rotation.y = Math.random() * Math.PI;
            return mesh;
        }

        // Capa trasera de montañas
        backdropGroup.add(createMountain(-25, -38, 1.8, 38, PALETTE.mountainBack));
        backdropGroup.add(createMountain(0, -42, 2.2, 45, PALETTE.mountainBack));
        backdropGroup.add(createMountain(28, -35, 1.9, 35, PALETTE.mountainBack));

        // Capa delantera de montañas
        backdropGroup.add(createMountain(-15, -30, 1.4, 28, PALETTE.mountainFront));
        backdropGroup.add(createMountain(18, -28, 1.6, 32, PALETTE.mountainFront));

        // Nubes planas estilizadas
        function createCloud(x, y, z, width) {
            const group = new THREE.Group();
            const mat = new THREE.MeshBasicMaterial({
                color: PALETTE.cloud,
                transparent: true,
                opacity: 0.7
            });
            
            // Reemplazo de CapsuleGeometry por CylinderGeometry con extremos esféricos para compatibilidad
            const radius = 1.2;
            const cylGeo = new THREE.CylinderGeometry(radius, radius, width, 12);
            const cylMesh = new THREE.Mesh(cylGeo, mat);
            cylMesh.rotation.z = Math.PI / 2;
            group.add(cylMesh);

            const capGeo = new THREE.SphereGeometry(radius, 12, 12);
            const cap1 = new THREE.Mesh(capGeo, mat);
            cap1.position.x = -width / 2;
            group.add(cap1);

            const cap2 = new THREE.Mesh(capGeo, mat);
            cap2.position.x = width / 2;
            group.add(cap2);

            group.position.set(x, y, z);
            return group;
        }

        backdropGroup.add(createCloud(-22, 32, -35, 8));
        backdropGroup.add(createCloud(5, 34, -38, 12));
        backdropGroup.add(createCloud(25, 30, -32, 7));

        scene.add(backdropGroup);

        // 3. ÁRBOLES Y PINOS (Pinos estilizados cónicos en capas)
        function createPineTree(x, z, heightScale = 1, color = PALETTE.pineMed) {
            const tree = new THREE.Group();

            // Tronco
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 3, 6);
            const trunkMat = flatMat(PALETTE.cabinWoodDark);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 1.5;
            trunk.castShadow = true;
            tree.add(trunk);

            // Capas de follaje
            const layers = 4;
            const foliageMat = flatMat(color);

            for (let i = 0; i < layers; i++) {
                const radius = (layers - i) * 0.9 * 0.9;
                const coneGeo = new THREE.ConeGeometry(radius, 3.2, 7);
                const cone = new THREE.Mesh(coneGeo, foliageMat);
                cone.position.y = 3 + i * 1.8;
                cone.castShadow = true;
                cone.receiveShadow = true;
                tree.add(cone);
            }

            tree.scale.set(heightScale, heightScale, heightScale);
            tree.position.set(x, 0, z);
            return tree;
        }

        // Árbol frondoso ovalado (como los 2 árboles frontales)
        function createDeciduousTree(x, z, scale = 1) {
            const tree = new THREE.Group();

            // Tronco con ramas simples
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.5, 4, 6);
            const trunkMat = flatMat(PALETTE.cabinWoodDark);
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.y = 2;
            trunk.castShadow = true;
            tree.add(trunk);

            // Copas ovaladas/estilizadas
            const foliageGeo = new THREE.SphereGeometry(2.2, 8, 8);
            foliageGeo.scale(0.8, 1.4, 0.8);
            const foliageMat = flatMat(PALETTE.deciduousTree);
            const foliage = new THREE.Mesh(foliageGeo, foliageMat);
            foliage.position.y = 4.8;
            foliage.castShadow = true;
            tree.add(foliage);

            tree.scale.set(scale, scale, scale);
            tree.position.set(x, 0, z);
            return tree;
        }

        const forestGroup = new THREE.Group();

        // Pinos de fondo detrás de la cabaña
        forestGroup.add(createPineTree(-6, -10, 1.5, PALETTE.pineDark));
        forestGroup.add(createPineTree(-1, -12, 1.8, PALETTE.pineDark));
        forestGroup.add(createPineTree(4, -11, 1.6, PALETTE.pineMed));
        forestGroup.add(createPineTree(9, -8, 1.4, PALETTE.pineLight));

        forestGroup.add(createPineTree(-12, -6, 1.3, PALETTE.pineMed));
        forestGroup.add(createPineTree(-16, -2, 1.2, PALETTE.pineDark));
        forestGroup.add(createPineTree(14, -4, 1.5, PALETTE.pineDark));
        forestGroup.add(createPineTree(18, 2, 1.1, PALETTE.pineMed));

        // Árboles planos tipo óvalo al frente (de la imagen)
        forestGroup.add(createDeciduousTree(-7, 3, 1.1));
        forestGroup.add(createDeciduousTree(7, 2, 1.15));

        scene.add(forestGroup);

        // 4. LA CABAÑA (Elemento Central)
        const cabinGroup = new THREE.Group();

        // Materiales de la Cabaña
        const woodWallMat = flatMat(PALETTE.cabinWoodDark);
        const woodBeamMat = flatMat(PALETTE.cabinWoodLight);
        const roofMat = flatMat(PALETTE.cabinRoof);

        // Material brillante para ventanas
        const windowMaterial = new THREE.MeshStandardMaterial({
            color: PALETTE.windowGlow,
            emissive: PALETTE.windowGlow,
            emissiveIntensity: 0.8,
            roughness: 0.2,
            flatShading: true
        });

        // Cuerpo Principal
        const mainBodyGeo = new THREE.BoxGeometry(8, 5, 7);
        const mainBody = new THREE.Mesh(mainBodyGeo, woodWallMat);
        mainBody.position.set(0, 2.5, 0);
        mainBody.castShadow = true;
        mainBody.receiveShadow = true;
        cabinGroup.add(mainBody);

        // Estructura del Techo A-Frame (Triángulo Frontal)
        const gablesShape = new THREE.Shape();
        gablesShape.moveTo(-4.2, 0);
        gablesShape.lineTo(0, 3.8);
        gablesShape.lineTo(4.2, 0);
        gablesShape.closePath();

        const extrudeSettings = { depth: 7.2, bevelEnabled: false };
        const gablesGeo = new THREE.ExtrudeGeometry(gablesShape, extrudeSettings);
        const gables = new THREE.Mesh(gablesGeo, woodWallMat);
        gables.position.set(0, 5, -3.6);
        gables.castShadow = true;
        cabinGroup.add(gables);

        // Paneles de Techo Dos Aguas
        const roofSide1Geo = new THREE.BoxGeometry(5.8, 8.2, 0.3);
        
        const roof1 = new THREE.Mesh(roofSide1Geo, roofMat);
        roof1.rotation.z = -Math.PI / 4.2;
        roof1.rotation.y = Math.PI / 2;
        roof1.position.set(-2.2, 6.7, 0);
        roof1.castShadow = true;
        cabinGroup.add(roof1);

        const roof2 = new THREE.Mesh(roofSide1Geo, roofMat);
        roof2.rotation.z = Math.PI / 4.2;
        roof2.rotation.y = Math.PI / 2;
        roof2.position.set(2.2, 6.7, 0);
        roof2.castShadow = true;
        cabinGroup.add(roof2);

        // Vigas de madera horizontales/decorativas en la fachada
        for (let i = 0; i < 4; i++) {
            const beamGeo = new THREE.BoxGeometry(7.6, 0.15, 0.15);
            const beam = new THREE.Mesh(beamGeo, woodBeamMat);
            beam.position.set(0, 5.2 + i * 0.8, 3.65);
            cabinGroup.add(beam);
        }

        // Puerta Frontal
        const doorGeo = new THREE.BoxGeometry(1.6, 3.2, 0.2);
        const doorMat = flatMat(0x1a1215);
        const door = new THREE.Mesh(doorGeo, doorMat);
        door.position.set(-0.8, 1.6, 3.55);
        cabinGroup.add(door);

        // Ventanita arriba de la puerta
        const doorWinGeo = new THREE.BoxGeometry(1.2, 0.8, 0.1);
        const doorWin = new THREE.Mesh(doorWinGeo, windowMaterial);
        doorWin.position.set(-0.8, 3.6, 3.56);
        cabinGroup.add(doorWin);

        // Ventana Grande Frontal
        const bigWinGeo = new THREE.BoxGeometry(3.2, 2.6, 0.1);
        const bigWindow = new THREE.Mesh(bigWinGeo, windowMaterial);
        bigWindow.position.set(2, 2.2, 3.56);
        cabinGroup.add(bigWindow);

        // Marco/Reticula de la Ventana Grande
        const frameMat = flatMat(PALETTE.cabinWoodDark);
        const frameV1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.6, 0.15), frameMat);
        frameV1.position.set(1.2, 2.2, 3.6);
        cabinGroup.add(frameV1);

        const frameV2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 2.6, 0.15), frameMat);
        frameV2.position.set(2.4, 2.2, 3.6);
        cabinGroup.add(frameV2);

        const frameH = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.12, 0.15), frameMat);
        frameH.position.set(2, 2.2, 3.6);
        cabinGroup.add(frameH);

        // Ventana del Ático (Triángulo/Buhardilla)
        const atticWinGeo = new THREE.BoxGeometry(1.1, 1.4, 0.1);
        const atticWin = new THREE.Mesh(atticWinGeo, windowMaterial);
        atticWin.position.set(2, 6.2, 3.62);
        cabinGroup.add(atticWin);

        // Ventanas Laterales (Izquierda)
        const sideWinGeo = new THREE.BoxGeometry(0.1, 1.8, 1.2);
        const sideWin1 = new THREE.Mesh(sideWinGeo, windowMaterial);
        sideWin1.position.set(-4.05, 2.3, 1.2);
        cabinGroup.add(sideWin1);

        const sideWin2 = new THREE.Mesh(sideWinGeo, windowMaterial);
        sideWin2.position.set(-4.05, 2.3, -1.2);
        cabinGroup.add(sideWin2);

        // Posicionar cabaña en la escena
        cabinGroup.position.set(-1, 0, 1);
        cabinGroup.rotation.y = 0.15; // Ligera inclinación estética
        scene.add(cabinGroup);

        // Guardar referencia a las ventanas con emisión para el Toggle de Luces
        const glowingWindows = [windowMaterial];

        // 5. DETALLES ADICIONALES (Arbustitos y Rocas en el suelo)
        function createBush(x, z, scale = 1) {
            const bushGeo = new THREE.DodecahedronGeometry(1.2, 1);
            const bushMat = flatMat(PALETTE.bush);
            const bush = new THREE.Mesh(bushGeo, bushMat);
            bush.scale.set(scale * 1.3, scale * 0.8, scale * 1.1);
            bush.position.set(x, scale * 0.5, z);
            bush.castShadow = true;
            return bush;
        }

        const detailsGroup = new THREE.Group();
        detailsGroup.add(createBush(-6, 5, 1.2));
        detailsGroup.add(createBush(-7.5, 6, 0.9));
        detailsGroup.add(createBush(4, 3.8, 1.1));
        detailsGroup.add(createBush(1.5, 4.2, 0.8));

        // Rocas cerca del estanque
        function createRock(x, z, scale = 1) {
            const rockGeo = new THREE.DodecahedronGeometry(1, 0);
            const rockMat = flatMat(0x3a3845);
            const rock = new THREE.Mesh(rockGeo, rockMat);
            rock.scale.set(scale, scale * 0.6, scale * 1.2);
            rock.rotation.y = Math.random() * Math.PI;
            rock.position.set(x, scale * 0.3, z);
            rock.castShadow = true;
            return rock;
        }

        detailsGroup.add(createRock(2, 6, 0.9));
        detailsGroup.add(createRock(-2.5, 7.5, 1.1));
        detailsGroup.add(createRock(12, 6, 1.4));

        scene.add(detailsGroup);


        // --- LÓGICA DE INTERACCIÓN Y CONTROLES UI ---

        let lightsOn = true;
        let isNight = true;

        const btnLights = document.getElementById('btn-lights');
        const statusLights = document.getElementById('status-lights');
        const btnMode = document.getElementById('btn-mode');
        const statusMode = document.getElementById('status-mode');
        const btnReset = document.getElementById('btn-reset');

        // Toggle Luces de la Cabaña
        btnLights.addEventListener('click', () => {
            lightsOn = !lightsOn;
            
            // Alternar intensidad de puntos de luz
            cabinLight1.intensity = lightsOn ? 2.5 : 0;
            cabinLight2.intensity = lightsOn ? 1.8 : 0;

            // Alternar emisión del material de las ventanas
            glowingWindows.forEach(mat => {
                mat.emissiveIntensity = lightsOn ? 0.8 : 0.05;
            });

            // UI feedback
            statusLights.textContent = lightsOn ? 'ON' : 'OFF';
            statusLights.className = lightsOn 
                ? 'text-xs bg-amber-400 text-slate-900 px-2 py-0.5 rounded-md font-bold'
                : 'text-xs bg-slate-700 text-slate-300 px-2 py-0.5 rounded-md font-bold';
        });

        // Toggle Día / Noche
        btnMode.addEventListener('click', () => {
            isNight = !isNight;

            if (isNight) {
                // Configuración Noche
                scene.background.setHex(PALETTE.nightSky);
                scene.fog.color.setHex(PALETTE.nightSky);
                ambientLight.color.setHex(0x233142);
                ambientLight.intensity = 0.8;
                moonLight.color.setHex(0xb0c4de);
                moonLight.intensity = 1.2;
                backdropGroup.visible = true;

                statusMode.textContent = 'Noche';
                statusMode.className = 'text-xs bg-indigo-400 text-slate-900 px-2 py-0.5 rounded-md font-bold';
            } else {
                // Configuración Día
                scene.background.setHex(PALETTE.daySky);
                scene.fog.color.setHex(PALETTE.daySky);
                ambientLight.color.setHex(0xffffff);
                ambientLight.intensity = 1.2;
                moonLight.color.setHex(0xfffaed);
                moonLight.intensity = 2.0;
                backdropGroup.visible = false; // Ocultar luna y fondo nocturno

                statusMode.textContent = 'Día';
                statusMode.className = 'text-xs bg-amber-300 text-slate-900 px-2 py-0.5 rounded-md font-bold';
            }
        });

        // Restablecer Vista de Cámara
        btnReset.addEventListener('click', () => {
            controls.reset();
            camera.position.copy(initialCameraPos);
            controls.target.set(0, 4, 0);
        });

        // --- ANIMACIÓN & LOOP ---
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Sutil animación de movimiento del agua
            if (water) {
                water.position.y = 0.05 + Math.sin(elapsedTime * 1.5) * 0.03;
            }

            // Actualización de controles OrbitControls
            controls.update();

            // Render
            renderer.render(scene, camera);
        }

        // --- RESPONSIVIDAD AL TAMAÑO DE VENTANA ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Iniciar escena en la carga
        window.onload = function() {
            animate();
        };

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Character Showcase - Inspector Carlton</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #121316;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        .glass-panel {
            background: rgba(22, 25, 31, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-slate-100">

    <div id="canvas-container"></div>

    <!-- UI Overlay Header -->
    <div class="absolute top-4 left-4 z-10 flex flex-col gap-1">
        <div class="glass-panel px-4 py-2 rounded-xl shadow-xl flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
            <div>
                <h1 class="font-bold text-sm tracking-wide text-slate-100">INSPECTOR CARLTON 3D MODEL</h1>
                <p class="text-xs text-slate-400">Interactive Character Rig & Palette Preview</p>
            </div>
        </div>
    </div>

    <!-- Palette Legend Display -->
    <div class="absolute top-4 right-4 z-10 hidden sm:flex glass-panel p-3 rounded-xl gap-2 shadow-xl items-center">
        <span class="text-xs font-semibold text-slate-400 mr-1">Palette:</span>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#737b7d;" title="Trench Coat (#737b7d)"></div>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#3c4347;" title="Jacket (#3c4347)"></div>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#838e8a;" title="Vest (#838e8a)"></div>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#824f33;" title="Tie (#824f33)"></div>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#4a3d31;" title="Pants (#4a3d31)"></div>
        <div class="w-5 h-5 rounded-full border border-white/20" style="background:#633c27;" title="Shoes (#633c27)"></div>
    </div>

    <!-- Bottom Controls & Hints -->
    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 flex flex-col items-center gap-3 w-full max-w-lg px-4">
        <!-- Key Navigation Guide -->
        <div class="glass-panel px-4 py-2 rounded-full text-xs text-slate-300 flex items-center gap-4 shadow-lg border border-white/10">
            <span class="flex items-center gap-1"><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-[10px] font-mono border border-slate-600">Left Drag</kbd> Rotate 3D</span>
            <span class="flex items-center gap-1"><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-[10px] font-mono border border-slate-600">WASD / Arrows</kbd> Rotate Axis</span>
            <span class="flex items-center gap-1"><kbd class="bg-slate-700/80 px-1.5 py-0.5 rounded text-[10px] font-mono border border-slate-600">Q / E</kbd> Roll Z</span>
        </div>

        <!-- Interactive Control Bar -->
        <div class="glass-panel p-2 rounded-2xl flex items-center gap-2 shadow-2xl border border-white/10">
            <button id="btn-reset" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> Reset Camera
            </button>
            <div class="h-4 w-px bg-white/10"></div>
            <button id="btn-toon" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5 text-emerald-400">
                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Anime Cel-Shading
            </button>
            <button id="btn-shadow" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5">
                <i data-lucide="sun" class="w-3.5 h-3.5"></i> Silhouette Mode
            </button>
            <div class="h-4 w-px bg-white/10"></div>
            <button id="btn-turntable" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-medium transition flex items-center gap-1.5">
                <i data-lucide="play" class="w-3.5 h-3.5" id="turntable-icon"></i> Auto-Spin
            </button>
        </div>
    </div>

    <!-- Script Block -->
    <script>
        // Color Palette Definitions matching prompt exactly
        const PALETTE = {
            hair: 0x1a1a1e,
            trenchOuter: 0x737b7d,
            trenchInner: 0x596063,
            jacket: 0x3c4347,
            vest: 0x838e8a,
            shirt: 0xf4f2f0,
            tie: 0x824f33,
            pants: 0x4a3d31,
            shoes: 0x633c27,
            skin: 0xf2cca8,
            eyes: 0x824f33,
            pedestal: 0x505457,
            bg: 0x181a1f
        };

        let scene, camera, renderer, controls;
        let characterGroup;
        let isTurntable = false;
        let isSilhouette = false;
        let isCelShaded = true;

        // Custom Toon Ramp Texture for Anime Cel-Shading Look
        function createToonGradient() {
            const canvas = document.createElement('canvas');
            canvas.width = 4;
            canvas.height = 1;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 4, 0);
            gradient.addColorStop(0, '#555555');
            gradient.addColorStop(0.5, '#888888');
            gradient.addColorStop(0.51, '#ffffff');
            gradient.addColorStop(1, '#ffffff');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 4, 1);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.NearestFilter;
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        const toonGradient = createToonGradient();

        // Material Creator Helper
        function getMat(color, isDoubleSide = false) {
            if (isSilhouette) {
                return new THREE.MeshBasicMaterial({ color: 0x111113, side: isDoubleSide ? THREE.DoubleSide : THREE.FrontSide });
            }
            if (isCelShaded) {
                return new THREE.MeshToonMaterial({
                    color: color,
                    gradientMap: toonGradient,
                    side: isDoubleSide ? THREE.DoubleSide : THREE.FrontSide
                });
            }
            return new THREE.MeshStandardMaterial({
                color: color,
                roughness: 0.7,
                metalness: 0.1,
                side: isDoubleSide ? THREE.DoubleSide : THREE.FrontSide
            });
        }

        let materialStore = [];

        function registerMesh(mesh, colorHex, doubleSide = false) {
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { colorHex, doubleSide };
            materialStore.push(mesh);
            return mesh;
        }

        function updateAllMaterials() {
            materialStore.forEach(mesh => {
                mesh.material = getMat(mesh.userData.colorHex, mesh.userData.doubleSide);
            });
        }

        // --- Initialization ---
        function init() {
            const container = document.getElementById('canvas-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(PALETTE.bg);
            scene.fog = new THREE.FogExp2(PALETTE.bg, 0.035);

            // Camera setup
            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2.2, 7.5);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.05;
            container.appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't go far under floor
            controls.minDistance = 2;
            controls.maxDistance = 15;
            controls.target.set(0, 1.8, 0);

            // Lighting
            setupLighting();

            // Build Stage / Pedestal
            buildStage();

            // Build Character
            characterGroup = new THREE.Group();
            buildCharacter(characterGroup);
            scene.add(characterGroup);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupKeyboardControls();
            setupUI();

            // Icons
            lucide.createIcons();

            // Start Loop
            animate();
        }

        function setupLighting() {
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            // Key Light (Main Shadow Caster)
            const keyLight = new THREE.DirectionalLight(0xfffaf0, 1.2);
            keyLight.position.set(4, 8, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.bias = -0.0001;
            scene.add(keyLight);

            // Soft Fill Light
            const fillLight = new THREE.DirectionalLight(0x90b0e0, 0.5);
            fillLight.position.set(-5, 4, -2);
            scene.add(fillLight);

            // Rim Light (Anime highlight from behind)
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
            rimLight.position.set(0, 5, -6);
            scene.add(rimLight);
        }

        function buildStage() {
            // Dark Elliptical Pedestal matching artwork
            const pedGeo = new THREE.CylinderGeometry(2.2, 2.4, 0.15, 64);
            const pedMat = new THREE.MeshStandardMaterial({ color: PALETTE.pedestal, roughness: 0.8 });
            const pedestal = new THREE.Mesh(pedGeo, pedMat);
            pedestal.position.y = -0.075;
            pedestal.receiveShadow = true;
            scene.add(pedestal);

            // Inner Shadow Disc
            const ringGeo = new THREE.RingGeometry(0, 2.1, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x101214, opacity: 0.6, transparent: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = -Math.PI / 2;
            ring.position.y = 0.001;
            scene.add(ring);
        }

        // --- CHARACTER PROCEDURAL MODELING ---
        function buildCharacter(root) {
            // 1. HEAD & FACE
            const headGroup = new THREE.Group();
            headGroup.position.y = 3.2;

            // Face Mesh (Anime V-shaped jaw line)
            const headGeo = new THREE.CylinderGeometry(0.24, 0.08, 0.42, 16);
            headGeo.scale(1, 1, 0.85);
            const headMesh = registerMesh(new THREE.Mesh(headGeo, getMat(PALETTE.skin)), PALETTE.skin);
            headGroup.add(headMesh);

            // Upper Cranium Dome
            const skullGeo = new THREE.SphereGeometry(0.25, 16, 16);
            skullGeo.scale(1, 1.1, 0.9);
            const skullMesh = registerMesh(new THREE.Mesh(skullGeo, getMat(PALETTE.skin)), PALETTE.skin);
            skullMesh.position.set(0, 0.1, -0.02);
            headGroup.add(skullMesh);

            // Ears
            const earGeo = new THREE.BoxGeometry(0.06, 0.1, 0.04);
            const leftEar = registerMesh(new THREE.Mesh(earGeo, getMat(PALETTE.skin)), PALETTE.skin);
            leftEar.position.set(0.24, 0.02, -0.02);
            leftEar.rotation.z = -0.2;
            headGroup.add(leftEar);

            const rightEar = leftEar.clone();
            rightEar.position.x = -0.24;
            rightEar.rotation.z = 0.2;
            headGroup.add(rightEar);

            // Eyes (Anime style styled brown iris)
            const eyeGeo = new THREE.PlaneGeometry(0.07, 0.05);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const leftEyeBorder = new THREE.Mesh(eyeGeo, eyeMat);
            leftEyeBorder.position.set(0.09, 0.03, 0.21);
            leftEyeBorder.rotation.y = 0.25;
            headGroup.add(leftEyeBorder);

            const rightEyeBorder = leftEyeBorder.clone();
            rightEyeBorder.position.x = -0.09;
            rightEyeBorder.rotation.y = -0.25;
            headGroup.add(rightEyeBorder);

            // Iris
            const irisGeo = new THREE.PlaneGeometry(0.04, 0.04);
            const irisMat = new THREE.MeshBasicMaterial({ color: PALETTE.eyes });
            const leftIris = new THREE.Mesh(irisGeo, irisMat);
            leftIris.position.set(0.09, 0.03, 0.215);
            leftIris.rotation.y = 0.25;
            headGroup.add(leftIris);

            const rightIris = leftIris.clone();
            rightIris.position.x = -0.09;
            rightIris.rotation.y = -0.25;
            headGroup.add(rightIris);

            // Sharp Eyebrows
            const browGeo = new THREE.BoxGeometry(0.09, 0.015, 0.01);
            const leftBrow = registerMesh(new THREE.Mesh(browGeo, getMat(PALETTE.hair)), PALETTE.hair);
            leftBrow.position.set(0.09, 0.08, 0.215);
            leftBrow.rotation.z = -0.15;
            headGroup.add(leftBrow);

            const rightBrow = leftBrow.clone();
            rightBrow.position.x = -0.09;
            rightBrow.rotation.z = 0.15;
            headGroup.add(rightBrow);

            // Messy Spiky Hair (Spikes & Bangs)
            const hairGroup = new THREE.Group();
            const spikeGeom = new THREE.ConeGeometry(0.08, 0.35, 4);

            // Hair spikes arrangement
            const hairSpikes = [
                { pos: [0, 0.25, 0.1], rot: [-0.6, 0, 0] },
                { pos: [0.1, 0.23, 0.12], rot: [-0.5, 0.3, -0.3] },
                { pos: [-0.1, 0.23, 0.12], rot: [-0.5, -0.3, 0.3] },
                { pos: [0.18, 0.18, 0.08], rot: [-0.2, 0.6, -0.5] },
                { pos: [-0.18, 0.18, 0.08], rot: [-0.2, -0.6, 0.5] },
                { pos: [0, 0.28, -0.05], rot: [0.4, 0, 0] },
                { pos: [0.15, 0.22, -0.1], rot: [0.5, 0.4, -0.3] },
                { pos: [-0.15, 0.22, -0.1], rot: [0.5, -0.4, 0.3] },
                // Center Bangs falling over face
                { pos: [0.03, 0.12, 0.22], rot: [-1.2, 0.1, -0.2], scale: [0.8, 1.1, 0.8] },
                { pos: [-0.05, 0.11, 0.22], rot: [-1.1, -0.2, 0.2], scale: [0.8, 1.1, 0.8] },
                { pos: [0.12, 0.09, 0.2], rot: [-1.0, 0.4, -0.4], scale: [0.7, 0.9, 0.7] }
            ];

            hairSpikes.forEach(s => {
                const spike = registerMesh(new THREE.Mesh(spikeGeom, getMat(PALETTE.hair)), PALETTE.hair);
                spike.position.set(...s.pos);
                spike.rotation.set(...s.rot);
                if (s.scale) spike.scale.set(...s.scale);
                hairGroup.add(spike);
            });
            headGroup.add(hairGroup);

            // Neck
            const neckGeo = new THREE.CylinderGeometry(0.09, 0.1, 0.22, 12);
            const neck = registerMesh(new THREE.Mesh(neckGeo, getMat(PALETTE.skin)), PALETTE.skin);
            neck.position.y = -0.22;
            headGroup.add(neck);

            root.add(headGroup);

            // 2. TORSO & LAYERED CLOTHING
            const torsoGroup = new THREE.Group();
            torsoGroup.position.y = 2.3;

            // Collar & Shirt
            const shirtCollarGeo = new THREE.ConeGeometry(0.2, 0.2, 4);
            const shirtCollar = registerMesh(new THREE.Mesh(shirtCollarGeo, getMat(PALETTE.shirt)), PALETTE.shirt);
            shirtCollar.position.set(0, 0.58, 0.02);
            shirtCollar.rotation.x = Math.PI;
            torsoGroup.add(shirtCollar);

            // Brown Necktie
            const tieGeo = new THREE.BoxGeometry(0.07, 0.45, 0.03);
            const tie = registerMesh(new THREE.Mesh(tieGeo, getMat(PALETTE.tie)), PALETTE.tie);
            tie.position.set(0, 0.35, 0.15);
            tie.rotation.x = 0.1;
            torsoGroup.add(tie);

            // Vest / Waistcoat (Sage green)
            const vestGeo = new THREE.CylinderGeometry(0.29, 0.27, 0.65, 16);
            vestGeo.scale(1.15, 1, 0.85);
            const vest = registerMesh(new THREE.Mesh(vestGeo, getMat(PALETTE.vest)), PALETTE.vest);
            vest.position.y = 0.22;
            torsoGroup.add(vest);

            // Vest Buttons
            for (let i = 0; i < 4; i++) {
                const buttonGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.01, 8);
                const button = registerMesh(new THREE.Mesh(buttonGeo, getMat(0x222222)), 0x222222);
                button.rotation.x = Math.PI / 2;
                button.position.set(0, 0.4 - (i * 0.11), 0.24);
                torsoGroup.add(button);
            }

            // Dark Charcoal Suit Jacket (Open front)
            const jacketLeftGeo = new THREE.BoxGeometry(0.18, 0.72, 0.38);
            const jacketLeft = registerMesh(new THREE.Mesh(jacketLeftGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            jacketLeft.position.set(0.22, 0.2, 0.02);
            jacketLeft.rotation.z = -0.05;
            torsoGroup.add(jacketLeft);

            const jacketRight = registerMesh(new THREE.Mesh(jacketLeftGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            jacketRight.position.set(-0.22, 0.2, 0.02);
            jacketRight.rotation.z = 0.05;
            torsoGroup.add(jacketRight);

            const jacketBackGeo = new THREE.BoxGeometry(0.5, 0.72, 0.1);
            const jacketBack = registerMesh(new THREE.Mesh(jacketBackGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            jacketBack.position.set(0, 0.2, -0.15);
            torsoGroup.add(jacketBack);

            root.add(torsoGroup);

            // 3. OVERCOAT / TRENCH COAT (Draped over shoulders)
            const trenchGroup = new THREE.Group();
            trenchGroup.position.y = 2.3;

            // Trench Collar
            const trenchCollarGeo = new THREE.CylinderGeometry(0.38, 0.42, 0.22, 16, 1, true, -Math.PI * 0.75, Math.PI * 1.5);
            const trenchCollar = registerMesh(new THREE.Mesh(trenchCollarGeo, getMat(PALETTE.trenchOuter, true)), PALETTE.trenchOuter, true);
            trenchCollar.position.set(0, 0.58, -0.02);
            trenchGroup.add(trenchCollar);

            // Trench Main Cape / Back Flap
            const trenchBackGeo = new THREE.CylinderGeometry(0.44, 0.68, 1.85, 16, 1, true, -Math.PI * 0.65, Math.PI * 1.3);
            const trenchBack = registerMesh(new THREE.Mesh(trenchBackGeo, getMat(PALETTE.trenchOuter, true)), PALETTE.trenchOuter, true);
            trenchBack.position.set(0, -0.25, -0.02);
            trenchGroup.add(trenchBack);

            // Left Draped Sleeve (Empty sleeve hanging effect)
            const sleeveGeo = new THREE.CylinderGeometry(0.18, 0.22, 1.3, 12);
            const leftSleeve = registerMesh(new THREE.Mesh(sleeveGeo, getMat(PALETTE.trenchOuter)), PALETTE.trenchOuter);
            leftSleeve.position.set(0.46, -0.05, 0.02);
            leftSleeve.rotation.z = -0.18;
            trenchGroup.add(leftSleeve);

            // Cuff Straps
            const strapGeo = new THREE.CylinderGeometry(0.21, 0.21, 0.05, 12);
            const leftStrap = registerMesh(new THREE.Mesh(strapGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            leftStrap.position.set(0.49, -0.45, 0.02);
            leftStrap.rotation.z = -0.18;
            trenchGroup.add(leftStrap);

            // Right Draped Sleeve
            const rightSleeve = registerMesh(new THREE.Mesh(sleeveGeo, getMat(PALETTE.trenchOuter)), PALETTE.trenchOuter);
            rightSleeve.position.set(-0.46, -0.05, 0.02);
            rightSleeve.rotation.z = 0.18;
            trenchGroup.add(rightSleeve);

            const rightStrap = registerMesh(new THREE.Mesh(strapGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            rightStrap.position.set(-0.49, -0.45, 0.02);
            rightStrap.rotation.z = 0.18;
            trenchGroup.add(rightStrap);

            root.add(trenchGroup);

            // 4. ARMS IN POCKETS POSE
            const armGroup = new THREE.Group();
            armGroup.position.y = 2.3;

            // Forearms angled into trouser pockets
            const upperArmGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.55, 12);
            const leftUpperArm = registerMesh(new THREE.Mesh(upperArmGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            leftUpperArm.position.set(0.3, 0.12, 0.08);
            leftUpperArm.rotation.set(0.2, 0, -0.35);
            armGroup.add(leftUpperArm);

            const leftForearmGeo = new THREE.CylinderGeometry(0.08, 0.07, 0.5, 12);
            const leftForearm = registerMesh(new THREE.Mesh(leftForearmGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            leftForearm.position.set(0.24, -0.22, 0.18);
            leftForearm.rotation.set(-0.7, 0.4, -0.2);
            armGroup.add(leftForearm);

            // Right Arm symmetrical
            const rightUpperArm = registerMesh(new THREE.Mesh(upperArmGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            rightUpperArm.position.set(-0.3, 0.12, 0.08);
            rightUpperArm.rotation.set(0.2, 0, 0.35);
            armGroup.add(rightUpperArm);

            const rightForearm = registerMesh(new THREE.Mesh(leftForearmGeo, getMat(PALETTE.jacket)), PALETTE.jacket);
            rightForearm.position.set(-0.24, -0.22, 0.18);
            rightForearm.rotation.set(-0.7, -0.4, 0.2);
            armGroup.add(rightForearm);

            root.add(armGroup);

            // 5. TROUSERS & LEGS
            const legsGroup = new THREE.Group();
            legsGroup.position.y = 1.15;

            // Tailored Trousers (Brown)
            const legGeo = new THREE.CylinderGeometry(0.16, 0.12, 1.25, 16);

            const leftLeg = registerMesh(new THREE.Mesh(legGeo, getMat(PALETTE.pants)), PALETTE.pants);
            leftLeg.position.set(0.17, 0, 0);
            leftLeg.rotation.z = -0.04;
            legsGroup.add(leftLeg);

            const rightLeg = registerMesh(new THREE.Mesh(legGeo, getMat(PALETTE.pants)), PALETTE.pants);
            rightLeg.position.set(-0.17, 0, 0);
            rightLeg.rotation.z = 0.04;
            legsGroup.add(rightLeg);

            // Pants center crease lines
            const creaseGeo = new THREE.BoxGeometry(0.01, 1.2, 0.01);
            const leftCrease = registerMesh(new THREE.Mesh(creaseGeo, getMat(0x352b22)), 0x352b22);
            leftCrease.position.set(0.17, 0, 0.15);
            legsGroup.add(leftCrease);

            const rightCrease = registerMesh(new THREE.Mesh(creaseGeo, getMat(0x352b22)), 0x352b22);
            rightCrease.position.set(-0.17, 0, 0.15);
            legsGroup.add(rightCrease);

            root.add(legsGroup);

            // 6. LEATHER SHOES
            const shoesGroup = new THREE.Group();
            shoesGroup.position.y = 0.2;

            const shoeShape = new THREE.BoxGeometry(0.15, 0.12, 0.32);
            shoeShape.translate(0, 0, 0.05);

            const leftShoe = registerMesh(new THREE.Mesh(shoeShape, getMat(PALETTE.shoes)), PALETTE.shoes);
            leftShoe.position.set(0.19, -0.1, 0.02);
            leftShoe.rotation.y = 0.12;
            shoesGroup.add(leftShoe);

            const rightShoe = registerMesh(new THREE.Mesh(shoeShape, getMat(PALETTE.shoes)), PALETTE.shoes);
            rightShoe.position.set(-0.19, -0.1, 0.02);
            rightShoe.rotation.y = -0.12;
            shoesGroup.add(rightShoe);

            // Sole details
            const soleGeo = new THREE.BoxGeometry(0.17, 0.03, 0.34);
            soleGeo.translate(0, 0, 0.05);
            const leftSole = registerMesh(new THREE.Mesh(soleGeo, getMat(0x22140c)), 0x22140c);
            leftSole.position.set(0.19, -0.16, 0.02);
            leftSole.rotation.y = 0.12;
            shoesGroup.add(leftSole);

            const rightSole = registerMesh(new THREE.Mesh(soleGeo, getMat(0x22140c)), 0x22140c);
            rightSole.position.set(-0.19, -0.16, 0.02);
            rightSole.rotation.y = -0.12;
            shoesGroup.add(rightSole);

            root.add(shoesGroup);
        }

        // --- KEYBOARD CONTROLS (WASD / Arrow Keys / Q / E Axis Rotations) ---
        const keysPressed = {};

        function setupKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                keysPressed[e.key.toLowerCase()] = true;

                // Quick keys
                if (e.key === '+' || e.key === '=') camera.position.multiplyScalar(0.92);
                if (e.key === '-' || e.key === '_') camera.position.multiplyScalar(1.08);
            });

            window.addEventListener('keyup', (e) => {
                keysPressed[e.key.toLowerCase()] = false;
            });
        }

        function handleKeyboardRotation() {
            const rotSpeed = 0.025;

            // Pitch X-Axis
            if (keysPressed['w'] || keysPressed['arrowup']) {
                characterGroup.rotation.x -= rotSpeed;
            }
            if (keysPressed['s'] || keysPressed['arrowdown']) {
                characterGroup.rotation.x += rotSpeed;
            }

            // Yaw Y-Axis
            if (keysPressed['a'] || keysPressed['arrowleft']) {
                characterGroup.rotation.y -= rotSpeed;
            }
            if (keysPressed['d'] || keysPressed['arrowright']) {
                characterGroup.rotation.y += rotSpeed;
            }

            // Roll Z-Axis
            if (keysPressed['q']) {
                characterGroup.rotation.z += rotSpeed;
            }
            if (keysPressed['e']) {
                characterGroup.rotation.z -= rotSpeed;
            }
        }

        // --- UI INTERACTION SETUP ---
        function setupUI() {
            document.getElementById('btn-reset').addEventListener('click', () => {
                camera.position.set(0, 2.2, 7.5);
                characterGroup.rotation.set(0, 0, 0);
                controls.target.set(0, 1.8, 0);
                controls.update();
            });

            document.getElementById('btn-toon').addEventListener('click', (e) => {
                isSilhouette = false;
                isCelShaded = !isCelShaded;
                e.currentTarget.classList.toggle('text-emerald-400', isCelShaded);
                updateAllMaterials();
            });

            document.getElementById('btn-shadow').addEventListener('click', () => {
                isSilhouette = !isSilhouette;
                updateAllMaterials();
            });

            const turntableBtn = document.getElementById('btn-turntable');
            turntableBtn.addEventListener('click', () => {
                isTurntable = !isTurntable;
                const icon = document.getElementById('turntable-icon');
                if (isTurntable) {
                    icon.setAttribute('data-lucide', 'pause');
                    turntableBtn.classList.add('text-emerald-400');
                } else {
                    icon.setAttribute('data-lucide', 'play');
                    turntableBtn.classList.remove('text-emerald-400');
                }
                lucide.createIcons();
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Continuous Turntable Rotation
            if (isTurntable) {
                characterGroup.rotation.y += 0.01;
            }

            // modificacion
        
            handleKeyboardRotation();

            controls.update();
            renderer.render(scene, camera);
        }

        // correr cuando finalice
        window.onload = init;
    </script>
</body>
</html>
